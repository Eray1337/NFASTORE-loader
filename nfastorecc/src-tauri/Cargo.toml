[package]
name = "nfastore_loader"
version = "0.3.0"
edition = "2021"
description = "NFAStore Steam cache login"
authors = ["NFAStore"]
build = "build.rs"

[lib]
name = "nfastore_loader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
clipboard = "0.5"
crc32fast = "1.4"
winreg = "0.52"

[dependencies.windows]
version = "0.56"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
